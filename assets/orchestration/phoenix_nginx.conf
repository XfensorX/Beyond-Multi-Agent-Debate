
pid /tmp/nginx.pid;


events {}


# --- gRPC (TCP load balancing) ---
stream {
    upstream phoenix_grpc {
        least_conn;
        server 127.0.0.1:46319;
        server 127.0.0.1:46320;
        server 127.0.0.1:46321;
        server 127.0.0.1:46322;
    }

    server {
        listen 46318;
        proxy_pass phoenix_grpc;
    }
}

# --- HTTP (UI + API) ---
http {
    client_max_body_size 0;
    client_body_buffer_size 256k;

    upstream phoenix_http {
        least_conn;
        server 127.0.0.1:46002;
        server 127.0.0.1:46003;
        server 127.0.0.1:46004;
        server 127.0.0.1:46005;
    }

    server {
        listen 46001;

        location / {
            proxy_pass http://phoenix_http;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}

