[project]
name = "social_studies"
version = "0.1.0"
description = "Some Experiments on behaviour of Agents in Groups"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "altair>=6.0.0",
    "arize-phoenix>=12.27.0",
    "arize-phoenix-client>=1.27.1",
    "beautifulsoup4>=4.14.2",
    "datamodel-code-generator>=0.52.2",
    "datasets>=4.4.1",
    "grpcio>=1.76.0",
    "grpcio-health-checking>=1.76.0",
    "httpx>=0.28.1",
    "hydra-core>=1.3.2",
    "ipywidgets>=8.1.8",
    "langchain>=1.1.0",
    "langchain-core>=1.1.0",
    "langchain-huggingface>=1.1.0",
    "langchain-ollama>=1.0.0",
    "langchain-openai>=1.1.0",
    "langgraph>=1.0.4",
    "logfire>=4.15.0",
    "matplotlib>=3.10.7",
    "notebook>=7.5.0",
    "numpy>=2.3.5",
    "omegaconf>=2.3.0",
    "openai>=2.8.1",
    "openinference-instrumentation-langchain>=0.1.56",
    "paddleocr[all,doc-parser]>=3.3.2",
    "paddlepaddle>=3.2.2",
    "pandas>=2.3.3",
    "pandas-stubs==2.3.2.250926",
    "patito>=0.8.5",
    "pdf2image>=1.17.0",
    "playwright>=1.56.0",
    "polars>=1.36.1",
    "pydantic>=2.12.4",
    "pydantic-ai>=1.20.0",
    "pymupdf-layout>=1.26.6",
    "pymupdf4llm>=0.2.4",
    "python-dotenv>=1.2.1",
    "rich>=14.2.0",
    "rich-pyfiglet>=1.0.0",
    "ruff>=0.14.8",
    "streamlit>=1.52.2",
    "taskipy>=1.14.1",
    "uv>=0.9.18",
    "zstandard>=0.25.0",
]

[tool.taskipy.tasks]
slurm = { cwd = ".", cmd = "bash scripts/slurm/experiment/start.sh", help = "Run an experiment on slurm. Need to run slurm_setup first. Specify experiment name: 'uv run task slurm standard'" }
slurm_setup = { cwd = ".", cmd = "bash scripts/slurm/tgi/start.sh && bash scripts/slurm/phoenix/start.sh", help = "Start Phoenix and TGI on Slurm, setup port forwarding via ssh to this computer. If cancelled, the jobs will still run on the server." }
phoenix = { cmd = "uv run phoenix serve", cwd = ".", help = "Start the phoenix server. Please assert environment variables are correctly set, e.g.:  PHOENIX_ALLOW_EXTERNAL_RESOURCES=false PHOENIX_WORKING_DIR='./results/phoenix'" }
pull_tgi_apptainer = { cwd = ".", cmd = "apptainer pull scripts/slurm/tgi/tgi.sif docker://ghcr.io/huggingface/text-generation-inference:2.3.0", help = "Pull the docker Image of TGI from huggingface and save it as apptainer sif." }
