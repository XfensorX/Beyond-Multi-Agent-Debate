# @package _global_
defaults:
  - _self_

experiment:
  name: no_discussion_voting
  data: mmlu-pro-big-subset
  strategy:
    name: multi-agent-debate
    configuration:
      number_of_rounds: 1

      debate_agents:
        - number_of_agents: 12
          params:
            max_new_tokens: 4096
            temperature: ${_temperature}
            top_p: 1.0
            top_k: null
            typical_p: null
            repetition_penalty: null
            seed: 42
          backend: ${_models.0}

  additional_info:
    description: No Discussion, just voting with ${_models.0} and temperature ${_temperature}



