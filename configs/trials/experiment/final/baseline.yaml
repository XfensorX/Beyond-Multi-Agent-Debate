# @package _global_
defaults:
  - _self_
  - /experiment/hetero/backend@experiment.strategy.configuration.backend: qwen-4b

hydra:
  sweeper:
    params:
      experiment/hetero/backend@experiment.strategy.configuration.backend: qwen-0_6b,qwen-4b,qwen-14b
      experiment.strategy.configuration.use_thinking: false, true
      experiment.strategy.configuration.use_few_shot_prompting: false, true



experiment:
  name: heterogeneous_group_baseline
  data: mmlu-pro-big-subset

  strategy:
    name: single-agent
    configuration:
      llm:
        max_new_tokens: 4096
        temperature: 0.0
        top_p: 0.1
        top_k: null
        typical_p: null
        repetition_penalty: null

      use_few_shot_prompting: true
      use_thinking: true

  additional_info:
    description: >-
      Baseline evaluation — ${experiment.strategy.configuration.backend.model_name}
      few_shot_prompting=${experiment.strategy.configuration.use_few_shot_prompting}
      use_thinking=${experiment.strategy.configuration.use_thinking}

