# @package _global_
defaults:
  - _self_

params_temperature: 0.0
params_top_p: 1.0

experiment:
  name: diversity_parameter_sweep_mad2
  data: mmlu-pro-subset

  strategy:
    name: multi-agent-debate
    configuration:
      number_of_rounds: 3

      debate_agents:
        - number_of_agents: 1
          params:
            max_new_tokens: 4096
            temperature: ${params_temperature}
            top_p: ${params_top_p}
            top_k: null
            typical_p: null
            repetition_penalty: null
          backend: ${_models.0}

        - number_of_agents: 1
          params:
            max_new_tokens: 4096
            temperature: ${params_temperature}
            top_p: ${params_top_p}
            top_k: null
            typical_p: null
            repetition_penalty: null
          backend: ${_models.1}


  additional_info:
    description: MAD2 Param Sweep top_p=${params_top_p}, temp=${params_temperature}— ${_models.0},${_models.1}



