# @package _global_
defaults:
  - _self_
  - hetero/backend@experiment.strategy.configuration.backend: qwen-4b

hydra:
  sweeper:
    params:
      experiment/hetero/backend@experiment.strategy.configuration.backend: qwen-0_6b,qwen-4b,qwen-14b


experiment:
  name: heterogeneous_group_baseline
  data: mmlu-pro-subset

  strategy:
    name: single-agent
    configuration:
      llm:
        max_new_tokens: 1024
        temperature: 0.0
        top_p: 0.1
        top_k: null
        typical_p: null
        repetition_penalty: null



  additional_info:
    description: Baseline evaluation — ${experiment.strategy.configuration.backend.model_name}




