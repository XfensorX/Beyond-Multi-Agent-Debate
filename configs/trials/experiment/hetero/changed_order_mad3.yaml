# @package _global_
defaults:
  - _self_
  - /experiment/hetero/groups@_models: LLL

hydra:
  sweeper:
    params:
      experiment/hetero/groups@_models: LLL, LLM, LLH, LML, LMM, LMH, LHL, LHM, LHH, MLL, MLM, MLH, MML, MMM, MMH, MHL, MHM, MHH, HLL, HLM, HLH, HML, HMM, HMH, HHL, HHM, HHH


experiment:
  name: changed_order_mad3
  data: mmlu-pro-subset

  strategy:
    name: multi-agent-debate
    configuration:
      number_of_rounds: 3

      debate_agents:
        - number_of_agents: 1
          params:
            max_new_tokens: 4096
            temperature: 0.0
            top_p: 1.0
            top_k: null
            typical_p: null
            repetition_penalty: null
          backend: ${_models.0}

        - number_of_agents: 1
          params:
            max_new_tokens: 4096
            temperature: 0.0
            top_p: 1.0
            top_k: null
            typical_p: null
            repetition_penalty: null
          backend: ${_models.1}


        - number_of_agents: 1
          params:
            max_new_tokens: 4096
            temperature: 0.0
            top_p: 1.0
            top_k: null
            typical_p: null
            repetition_penalty: null
          backend: ${_models.2}



  additional_info:
    description: Changed Order MAD3 — ${_models.0},${_models.1},${_models.2}



