# @package _global_
defaults:
  - _self_
  - _num_different_proposals: 2
  - _council_size: 2
  - /experiment/hetero/groups@_models: LL

hydra:
  sweeper:
    params:
      _num_different_proposals: 2, 3
      _council_size: 2, 3
      experiment/hetero/groups@_models: LL, LM, LH, ML, MM, MH, HL, HM, HH

experiment:
  name: tribal_council
  data: mmlu-pro-subset
  strategy:
    name: tribal-council-standard
    configuration:
      num_different_proposals: ${_num_different_proposals}
      accept_after_n_invalid_proposals: 7
      total_invalid_question_formulations_accepted: 5
      total_invalid_final_decisions_accepted: 5

      proposal_agent:
        llm:
          max_new_tokens: 4096
          temperature: 0.2
          top_p: 1.0
          top_k: null
          typical_p: null
          repetition_penalty: null
        backend: ${_models.0}

      council_size: ${_council_size}
      council_agent:
        llm:
          max_new_tokens: 4096
          temperature: 0.2
          top_p: 1.0
          top_k: null
          typical_p: null
          repetition_penalty: null
        backend: ${_models.1}

  additional_info:
    description: Standard Tribal Council (size ${_council_size}) with {_num_different_proposals} different proposals. Proposer = ${_models.0} and Council ${_models.1}