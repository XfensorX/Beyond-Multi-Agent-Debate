# @package _global_
defaults:
  - _self_
  - /experiment/hetero/groups/Qwen3@_models: LL

hydra:
  sweeper:
    params:
      num_different_proposals: 2, 3
      council_size: 2, 3
      experiment/hetero/groups/Qwen3@_models: LL, LM, LH, ML, MM, MH, HL, HM, HH


num_different_proposals: 2
council_size: 2


experiment:
  name: tribal_council-sweep
  data: mmlu-pro-single
  strategy:
    name: tribal-council
    configuration:
      num_different_proposals: ${num_different_proposals}
      accept_after_n_invalid_proposals: 7
      accept_after_n_same_proposals: 3
      total_invalid_question_formulations_accepted: 5
      total_invalid_final_decisions_ignored: 3

      proposal_agents:
        - number_of_agents: 1
          llm:
            max_new_tokens: 4096
            temperature: 0.2
            top_p: 1.0
            top_k: null
            typical_p: null
            repetition_penalty: null
            seed: 42
          backend: ${_models.0}
          with_thinking: True

      council_agents:
        - llm:
            max_new_tokens: 4096
            temperature: 0.2
            top_p: 1.0
            top_k: null
            typical_p: null
            repetition_penalty: null
            seed: 42
          backend: ${_models.1}
          number_of_agents: ${council_size}
          with_thinking: True

  additional_info:
    description: >-
      Standard Tribal Council(size ${council_size})
      with {num_different_proposals} different proposals.
      Proposer = ${_models.0} and Council ${_models.1}